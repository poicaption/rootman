<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #ffffff; padding: 24px;
    display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; }
  .cap { background: #ffffff; }

  .rv-phone {
    width: 380px; background: #fff; border-radius: 16px; overflow: hidden;
    color: #050505;
    font-family: "Noto Sans Thai", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
  }
  .rv-hd { display: flex; align-items: center; gap: 9px; padding: 11px 12px 10px; border-bottom: 1px solid #e9ebee; }
  .rv-hd .rv-back { color: #0866ff; font-size: 24px; line-height: 1; font-weight: 400; flex-shrink: 0; }
  .rv-hd-av { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; background: conic-gradient(from 30deg, #f6c8ae, #d9b0c4, #c9c0e0, #b7d0e8, #d7c3b0, #f0c9c0); filter: blur(6px); }
  .rv-hd-mid { flex: 1; min-width: 0; }
  .rv-hd-name { font-weight: 700; font-size: 15px; color: #050505; filter: blur(4.5px); white-space: nowrap; overflow: hidden; text-overflow: clip; letter-spacing: .3px; }
  .rv-hd-sub { color: #65676b; font-size: 11.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rv-hd-ic { flex-shrink: 0; display: flex; align-items: center; gap: 10px; color: #0866ff; }
  .rv-hd-ic .rv-baht { width: 26px; height: 26px; border: 1.6px solid #0866ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
  .rv-hd-ic .rv-dots { font-size: 20px; color: #050505; letter-spacing: -1px; }

  .rv-body { padding: 16px 12px 16px; display: flex; flex-direction: column; gap: 3px; background: #fff; }
  .rv-row { display: flex; align-items: flex-end; gap: 7px; margin-top: 9px; }
  .rv-row.a { justify-content: flex-end; }
  .rv-row .rv-av { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; align-self: flex-end;
    background: conic-gradient(from 60deg, #e8b7c4, #c9bfe0, #b3cfe8, #d8c6ae, #efc7bf); filter: blur(5px); }
  .rv-bubs { display: flex; flex-direction: column; gap: 3px; max-width: 74%; }
  .rv-row.a .rv-bubs { align-items: flex-end; }
  .rv-bub { position: relative; padding: 8px 13px; font-size: 14.5px; line-height: 1.35; word-wrap: break-word; white-space: pre-wrap; }
  .rv-bub.c { background: #e9ebee; color: #050505; border-radius: 18px; }
  .rv-bub.a { background: #0a7cff; color: #fff; border-radius: 18px; }
  .rv-bubs.c .rv-bub { border-top-left-radius: 5px; border-bottom-left-radius: 5px; }
  .rv-bubs.c .rv-bub:first-child { border-top-left-radius: 18px; }
  .rv-bubs.c .rv-bub:last-child { border-bottom-left-radius: 18px; }
  .rv-bubs.a .rv-bub { border-top-right-radius: 5px; border-bottom-right-radius: 5px; }
  .rv-bubs.a .rv-bub:first-child { border-top-right-radius: 18px; }
  .rv-bubs.a .rv-bub:last-child { border-bottom-right-radius: 18px; }
  .rv-bub .rv-react { position: absolute; bottom: -11px; background: #fff; border-radius: 999px;
    padding: 1px 4px; font-size: 12px; line-height: 1; box-shadow: 0 1px 4px rgba(0,0,0,.22); }
  .rv-bub.a .rv-react { right: 6px; }
  .rv-bub.c .rv-react { left: 6px; }
  .rv-seen { display: flex; justify-content: flex-end; margin-top: 8px; }
  .rv-seen .rv-av { width: 16px; height: 16px; border-radius: 50%;
    background: conic-gradient(from 60deg, #e8b7c4, #c9bfe0, #b3cfe8, #d8c6ae, #efc7bf); filter: blur(3px); }

  function rvAvatar(hueA, hueB, blur, size) {
    return '<span class="rv-av" style="width:' + size + 'px;height:' + size + 'px;background:conic-gradient(from ' +
      hueA + 'deg, hsl(' + hueA + ',55%,72%), hsl(' + hueB + ',50%,68%), hsl(' + ((hueA + 90) % 360) +
      ',52%,74%), hsl(' + ((hueB + 180) % 360) + ',48%,70%));filter:blur(' + blur + 'px);"></span>';
  }

  function rvRenderOne(rv, hue) {
    var html = '<div class="rv-phone">';
    html += '<div class="rv-hd">' +
      '<span class="rv-back">&#8249;</span>' +
      '<span class="rv-hd-av" style="background:conic-gradient(from ' + hue[0] + 'deg, hsl(' + hue[0] +
      ',55%,72%), hsl(' + hue[1] + ',50%,68%), hsl(' + ((hue[0] + 120) % 360) + ',52%,74%));"></span>' +
      '<div class="rv-hd-mid">' +
      '<div class="rv-hd-name">' + esc(rv.n) + '</div>' +
      '<div class="rv-hd-sub">+ เพิ่มรายละเอียดและป้ายกำกับ</div>' +
      '</div>' +
      '<div class="rv-hd-ic"><span class="rv-baht">&#3647;</span><span class="rv-dots">&#8942;</span></div>' +
      '</div>';
    html += '<div class="rv-body">';
    var msgs = rv.m, i = 0;
    while (i < msgs.length) {
      var side = msgs[i][0];
      var group = [];
      while (i < msgs.length && msgs[i][0] === side) { group.push(msgs[i]); i++; }
      html += '<div class="rv-row ' + side + '">';
      if (side === 'c') html += rvAvatar(hue[0], hue[1], 5, 28);
      html += '<div class="rv-bubs ' + side + '">';
      group.forEach(function (mm) {
        var react = mm[2] ? '<span class="rv-react">&#10084;&#65039;</span>' : '';
        html += '<div class="rv-bub ' + side + '">' + esc(mm[1]) + react + '</div>';
      });
      html += '</div></div>';
    }
    if (msgs.length && msgs[msgs.length - 1][0] === 'a') {
      html += '<div class="rv-seen">' + rvAvatar(hue[0], hue[1], 3, 16) + '</div>';
    }
    html += '</div></div>';
    return html;
  }

  var out = '';
  for (var k = 0; k < REVIEWS.length; k++) {
    var hue = [Math.floor(Math.random() * 360), Math.floor(Math.random() * 360)];
    out += '<div class="cap" id="cap-' + (k + 1) + '" data-cat="' + (REVIEWS[k].g || '') + '">' +
      rvRenderOne(REVIEWS[k], hue) + '</div>';
  }
  document.body.insertAdjacentHTML('beforeend', out);
</script>
